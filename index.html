<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Netaji Royale</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#18251a;font-family:Arial;color:white;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.box{background:#111c19dd;padding:8px 12px;border-radius:10px;border:1px solid #ffffff55}#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between}#health{width:120px;height:8px;background:#532;margin-top:5px;border-radius:5px;overflow:hidden}#bar{height:100%;width:100%;background:#36e765}#zone{font-size:11px;color:#ffe36a;margin-top:4px}#controls{position:fixed;inset:0;pointer-events:none}#joy{position:absolute;left:22px;bottom:18px;width:105px;height:105px;border-radius:50%;background:#ffffff24;border:2px solid #ffffff88;pointer-events:auto}#knob{position:absolute;left:29px;top:29px;width:43px;height:43px;border-radius:50%;background:#ffffffbb;border:2px solid white}button{border:0;border-radius:50%;font-weight:bold;pointer-events:auto;touch-action:none}#fire{position:absolute;right:22px;bottom:20px;width:75px;height:75px;background:#e84132;color:white;border:3px solid white;font-size:14px}#reload{position:absolute;right:105px;bottom:25px;width:52px;height:52px;background:#f4c62f;font-size:23px}#start{position:fixed;inset:0;z-index:5;background:linear-gradient(135deg,#102016,#243e29);display:flex;justify-content:center;align-items:center;text-align:center;padding:15px}.card{background:#101914;border:1px solid #ffffff55;border-radius:20px;padding:25px;max-width:420px}h1{font-size:42px;color:#ffd343;margin:0}#startBtn{border-radius:12px;padding:14px 25px;background:#ffd343;font-size:18px}#msg{position:absolute;top:35%;left:0;width:100%;text-align:center;font-size:30px;font-weight:bold}@media (orientation:portrait){#rotate{display:flex!important}}#rotate{display:none;position:fixed;inset:0;z-index:10;background:#101914;color:white;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:22px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div id="top"><div class="box"><b>🇮🇳 NETAJI ROYALE</b><div style="font-size:11px">HP: <span id="hp">100</span>/100</div><div id="health"><div id="bar"></div></div><div id="zone">SAFE ZONE ACTIVE</div></div><div class="box" style="text-align:right"><b>ALIVE: <span id="alive">6</span></b><div style="font-size:12px">KILLS: <span id="kills">0</span></div><div style="font-size:12px">AMMO: <span id="ammo">30</span></div></div></div><div id="msg"></div></div>
<div id="controls"><div id="joy"><div id="knob"></div></div><button id="fire">FIRE</button><button id="reload">↻</button></div>
<div id="rotate"><div>📱<br><br>Please rotate your phone horizontally<br><br>↻</div></div>
<div id="start"><div class="card"><h1>NETAJI<br>ROYALE</h1><p>Battle Arena — Cartoon Political Characters</p><p>Move • Aim • Shoot • Survive</p><button id="startBtn">▶ START MATCH</button><p style="font-size:12px">Fictional arcade game. Single-player prototype.</p></div></div>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");let W,H,playing=false,keys={},player,enemies=[],bullets=[],kills=0,ammo=30,fireHeld=false,last=0,zoneRadius=600,joy={x:0,y:0},aim={x:1,y:0},reloading=false;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;W=c.width;H=c.height}addEventListener("resize",resize);resize();
const names=[["Narendra Modi","#e5a34b","#e8ded0"],["Rahul Gandhi","#e8e8e8","#252525"],["Arvind Kejriwal","#8daecb","#292929"],["Mamata Banerjee","#eeeeee","#333333"],["Yogi Adityanath","#ed873d","#222222"]];
function spawn(){let a=Math.random()*Math.PI*2,d=200+Math.random()*300,n=names[Math.floor(Math.random()*names.length)];enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,hp:100,angle:0,name:n[0],color:n[1],hair:n[2],speed:65+Math.random()*30,cool:Math.random()+.5})}
function reset(){player={x:0,y:0,hp:100,speed:220,angle:0};enemies=[];bullets=[];kills=0;ammo=30;zoneRadius=600;reloading=false;for(let i=0;i<5;i++)spawn();updateHUD()}
function updateHUD(){document.getElementById("hp").textContent=Math.max(0,Math.ceil(player.hp));document.getElementById("bar").style.width=Math.max(0,player.hp)+"%";document.getElementById("alive").textContent=enemies.length+(player.hp>0?1:0);document.getElementById("kills").textContent=kills;document.getElementById("ammo").textContent=ammo}
document.getElementById("startBtn").onclick=()=>{reset();playing=true;document.getElementById("start").style.display="none";if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(()=>{})}).catch(()=>{});last=performance.now();requestAnimationFrame(loop)};
function shoot(){if(!playing||ammo<=0||reloading)return;ammo--;let a=Math.atan2(aim.y,aim.x);bullets.push({x:player.x+Math.cos(a)*22,y:player.y+Math.sin(a)*22,vx:Math.cos(a)*570,vy:Math.sin(a)*570,life:1});updateHUD()}
document.getElementById("fire").onpointerdown=e=>{e.preventDefault();fireHeld=true;shoot()};["pointerup","pointercancel","pointerleave"].forEach(ev=>document.getElementById("fire").addEventListener(ev,()=>fireHeld=false));
function reloadGun(){if(!reloading&&ammo<30){reloading=true;setTimeout(()=>{ammo=30;reloading=false;updateHUD()},1200)}}document.getElementById("reload").onpointerdown=e=>{e.preventDefault();reloadGun()};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key===" ")shoot();if(e.key.toLowerCase()==="r")reloadGun()});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const joyEl=document.getElementById("joy"),knob=document.getElementById("knob");let joyId=null;joyEl.onpointerdown=e=>{joyId=e.pointerId;joyEl.setPointerCapture(joyId);moveJoy(e)};joyEl.onpointermove=e=>{if(e.pointerId===joyId)moveJoy(e)};
function moveJoy(e){let r=joyEl.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=30,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max}joy.x=dx/max;joy.y=dy/max;knob.style.left=(r.width/2-21+dx)+"px";knob.style.top=(r.height/2-21+dy)+"px"}function endJoy(){joyId=null;joy.x=joy.y=0;knob.style.left="29px";knob.style.top="29px"}joyEl.onpointerup=endJoy;joyEl.onpointercancel=endJoy;
c.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")setAim(e)});c.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"&&e.buttons)setAim(e);else if(e.pointerType!=="mouse"&&e.clientX>innerWidth*.45)setAim(e)});function setAim(e){let dx=e.clientX-innerWidth/2,dy=e.clientY-innerHeight/2,m=Math.hypot(dx,dy)||1;aim={x:dx/m,y:dy/m};player.angle=Math.atan2(dy,dx)}
function update(dt){let mx=joy.x,my=joy.y;if(keys.w||keys.arrowup)my--;if(keys.s||keys.arrowdown)my++;if(keys.a||keys.arrowleft)mx--;if(keys.d||keys.arrowright)mx++;let m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}player.x+=mx*player.speed*dt;player.y+=my*player.speed*dt;if(fireHeld&&Math.random()<dt*5)shoot();zoneRadius=Math.max(130,600-performance.now()/1000*1.3);if(Math.hypot(player.x,player.y)>zoneRadius){player.hp-=8*dt;document.getElementById("zone").textContent="⚠ OUTSIDE ZONE"}else document.getElementById("zone").textContent="SAFE ZONE ACTIVE";
enemies.forEach(e=>{let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.angle=Math.atan2(dy,dx);if(d>35){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}e.cool-=dt;if(e.cool<0&&d<360){e.cool=1.2+Math.random();bullets.push({x:e.x,y:e.y,vx:dx/d*240,vy:dy/d*240,life:2,enemy:true})}if(d<28)player.hp-=10*dt});
bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(!b.enemy)enemies.forEach(e=>{if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<22){e.hp-=50;b.life=0;if(e.hp<=0)kills++}});else if(Math.hypot(b.x-player.x,b.y-player.y)<20){player.hp-=8;b.life=0}});
bullets=bullets.filter(b=>b.life>0);enemies=enemies.filter(e=>e.hp>0);if(enemies.length<5&&kills<10&&Math.random()<dt*.15)spawn();updateHUD();if(player.hp<=0)endGame("MATCH OVER");if(enemies.length===0)endGame("BOOYAH!")}
function drawPerson(p,isPlayer=false){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle||0);ctx.fillStyle=p.color||"#32aaff";ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.fillStyle="#b9805b";ctx.beginPath();ctx.arc(5,-4,7,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.hair||"#282828";ctx.beginPath();ctx.arc(4,-8,7,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle="#222";ctx.fillRect(8,-4,25,7);ctx.restore();if(!isPlayer){ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-24);ctx.fillStyle="#431d1d";ctx.fillRect(p.x-17,p.y-20,34,4);ctx.fillStyle="#ff3f36";ctx.fillRect(p.x-17,p.y-20,34*Math.max(0,p.hp/100),4)}}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.scale(devicePixelRatio,devicePixelRatio);ctx.translate(innerWidth/2-player.x,innerHeight/2-player.y);ctx.fillStyle="#6e8a4c";ctx.fillRect(-3000,-3000,6000,6000);for(let x=-3000;x<3000;x+=70)for(let y=-3000;y<3000;y+=70){ctx.fillStyle=((x+y)%3)?"#789652":"#658447";ctx.fillRect(x,y,3,5)}ctx.strokeStyle="#b6a27a";ctx.lineWidth=80;ctx.beginPath();ctx.moveTo(-2500,200);ctx.lineTo(2500,500);ctx.stroke();ctx.beginPath();ctx.arc(0,0,zoneRadius,0,Math.PI*2);ctx.strokeStyle="#42e7ff";ctx.lineWidth=5;ctx.setLineDash([14,10]);ctx.stroke();ctx.setLineDash([]);bullets.forEach(b=>{ctx.fillStyle=b.enemy?"#ff443c":"#ffe36b";ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()});enemies.forEach(e=>drawPerson(e));drawPerson({x:player.x,y:player.y,angle:player.angle,color:"#2aa6ff",hair:"#252525"},true);ctx.restore()}
function endGame(text){playing=false;document.getElementById("msg").innerHTML=text+"<br><button onclick='location.reload()' style='border-radius:10px;margin-top:12px'>PLAY AGAIN</button>"}
function loop(t){if(!playing)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();if(playing)requestAnimationFrame(loop)}reset();draw();
</script>
</body>
</html>
